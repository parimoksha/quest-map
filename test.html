<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winding Roadmap</title>
    <style>
        body {
            font-family: sans-serif;
            background: #fff;
            padding: 40px;
            display: flex;
            justify-content: center;
        }

        /* 
          The roadmap container controls the max width and aspect ratio.
          It scales down cleanly on smaller mobile screens.
        */
        .roadmap {
            position: relative;
            width: 100%;
            max-width: 320px;
            height: 500px; /* Matches the viewBox height */
        }

        /* SVG container stretches to fit the wrapper fluidly */
        .roadmap-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: visible; /* Prevents deep curves from clipping */
            pointer-events: none;
        }

        /* The winding dashed curve */
        .path-line {
            fill: none;
            stroke: #333;
            stroke-width: 3;
            stroke-dasharray: 6 6;
        }

        /* Milestone nodes are positioned absolutely using pixels matching the viewBox coordinates */
        .node {
            position: absolute;
            transform: translateY(-50%); /* Centers node vertically on its point */
            z-index: 1;
            padding: 10px 20px;
            border: 2px solid #333;
            border-radius: 50px;
            background: #fff;
            font-weight: bold;
            font-size: 14px;
            white-space: nowrap;
        }

        /* Node coordinates matching the path start/end points */
        .node.top    { top: 40px;  left: 20px; }
        .node.right-1 { top: 140px; right: 20px; }
        .node.left-1  { top: 240px; left: 20px; }
        .node.right-2 { top: 340px; right: 20px; }
        .node.left-2  { top: 440px; left: 20px; }
    </style>
</head>
<body>

    <div class="roadmap">
        <!-- 
          viewBox="0 0 320 500": 
          320 is the width, 500 is the height. 
          The browser will automatically scale this coordinate system up or down on any screen size.
        -->
        <svg class="roadmap-svg" viewBox="0 0 320 500" xmlns="http://www.w3.org/2000/svg">
            <!-- Curve 1: Top -> Right (Explore) -->
            <path class="path-line" d="M 60 40 C 60 100, 260 80, 260 140" />

            <!-- Curve 2: Right (Explore) -> Left (Learn) -->
            <path class="path-line" d="M 260 140 C 260 200, 60 180, 60 240" />

            <!-- Curve 3: Left (Learn) -> Right (Practice) -->
            <path class="path-line" d="M 60 240 C 60 300, 260 280, 260 340" />

            <!-- Curve 4: Right (Practice) -> Left (Master) -->
            <path class="path-line" d="M 260 340 C 260 400, 60 380, 60 440" />
        </svg>

        <!-- Node Contents placed to match path start/end points -->
        <div class="node top">🏁 Year 1</div>
        <div class="node right-1">Explore</div>
        <div class="node left-1">Learn</div>
        <div class="node right-2">Practice</div>
        <div class="node left-2">Master</div>
    </div>

</body>
</html>
